name = "shy-dawn-d7a9"
main = "src/index.js"
compatibility_date = "2025-11-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# R2 bucket for story photos
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "freespikes"

# Email service for notifications
[[send_email]]
name = "EMAIL"

# Plain-text / env vars (set values in dashboard or via wrangler secret)
# NOTIFY_EMAIL, ADMIN_PASSWORD, DOMAIN, and DB (D1) are configured in the dashboard.
