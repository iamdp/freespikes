name = "shy-dawn-d7a9"
main = "src/index.js"
compatibility_date = "2025-11-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# R2 bucket for story photos
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "freespikes"

# D1 database for submissions
[[d1_databases]]
binding = "DB"
database_id = "b342e032-150e-49f4-92c5-9b603c1403a4"

# Email service for notifications
[[send_email]]
name = "EMAIL"

# Plain-text variables
[vars]
NOTIFY_EMAIL = "email@davidpham.ca"
# ADMIN_PASSWORD and DOMAIN can be added here or left as dashboard secrets
